# CD: after CI is green on main → staging (automatic) → production (after an approver clicks Approve).
# Each target is a GitHub Environment with its own Supabase project and Netlify site, so a property that needs its own
# database can be given its own target (e.g. "prod-pumzika") and is deployed, checked and approved on its own.
#
# Run by hand (Actions → Deploy → Run workflow) to redeploy any earlier release tag, e.g. to roll back the web app.
name: Deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag or commit to deploy (blank = latest main)
        required: false
      only:
        description: Deploy just this environment (blank = staging, then every production target)
        required: false

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.p.outputs.sha }}
      production: ${{ steps.p.outputs.production }}
      staging: ${{ steps.p.outputs.staging }}
    steps:
      - id: p
        env:
          TARGETS: ${{ vars.PRODUCTION_TARGETS || '["production"]' }}
        run: |
          sha="${{ github.event.inputs.ref || github.event.workflow_run.head_sha || github.sha }}"
          only="${{ github.event.inputs.only }}"
          echo "sha=$sha" >> $GITHUB_OUTPUT
          if [ -n "$only" ]; then
            if [ "$only" = "staging" ]; then echo 'production=[]' >> $GITHUB_OUTPUT; echo "staging=true" >> $GITHUB_OUTPUT;
            else echo "production=[\"$only\"]" >> $GITHUB_OUTPUT; echo "staging=false" >> $GITHUB_OUTPUT; fi
          else
            echo "production=$TARGETS" >> $GITHUB_OUTPUT; echo "staging=true" >> $GITHUB_OUTPUT
          fi
          echo "### Deploying \`$sha\`" >> $GITHUB_STEP_SUMMARY

  staging:
    needs: plan
    if: needs.plan.outputs.staging == 'true'
    uses: ./.github/workflows/deploy-target.yml
    with:
      environment: staging
      sha: ${{ needs.plan.outputs.sha }}
    secrets: inherit

  production:
    needs: [plan, staging]
    if: always() && needs.plan.result == 'success' && (needs.staging.result == 'success' || needs.staging.result == 'skipped') && needs.plan.outputs.production != '[]'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        environment: ${{ fromJSON(needs.plan.outputs.production) }}
    uses: ./.github/workflows/deploy-target.yml
    with:
      environment: ${{ matrix.environment }}
      sha: ${{ needs.plan.outputs.sha }}
    secrets: inherit

  release:
    needs: [plan, production]
    if: needs.production.result == 'success' && github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ needs.plan.outputs.sha }}' }
      - name: Tag the release
        run: |
          tag="release-$(date -u +%Y%m%d-%H%M)"
          git tag "$tag" && git push origin "$tag"
          echo "Released as \`$tag\`" >> $GITHUB_STEP_SUMMARY
