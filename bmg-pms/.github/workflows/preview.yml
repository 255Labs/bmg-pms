# Every pull request gets its own preview site (pr-<number>--<site>.netlify.app) running against the STAGING
# database, so screens can be tried before merging. Needs a "preview" environment with the staging values.
name: Preview
on:
  pull_request:
    paths: ['src/**', 'public/**', 'index.html', 'package*.json', 'vite.config.js']

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - id: deploy
        run: |
          npx --yes netlify-cli@17 deploy --dir dist --site "$NETLIFY_SITE_ID" --alias "pr-${{ github.event.pull_request.number }}" --json > out.json
          echo "url=$(node -p "require('./out.json').deploy_url")" >> $GITHUB_OUTPUT
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
      - uses: actions/github-script@v7
        with:
          script: |
            const body = `Preview (staging data): ${{ steps.deploy.outputs.url }}`;
            const { data } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const mine = data.find((c) => c.user.type === 'Bot' && c.body.startsWith('Preview (staging data)'));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
